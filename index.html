<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d0d12">
<title>Моя Волна</title>
<style>
:root{--bg:#0d0d12;--card:#181822;--accent:#ff4757;--glow:rgba(255,71,87,0.45);--text:#fff;--sub:#9494a8}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;padding:18px 18px 80px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-size:20px;font-weight:800}.logo span{color:var(--accent)}
.badge{font-size:11px;background:var(--card);padding:5px 10px;border-radius:20px;color:var(--sub);border:1px solid #262636}
.screen{display:none;flex:1;flex-direction:column}.screen.active{display:flex}
.wave-btn{width:150px;height:150px;border-radius:50%;border:none;margin:8px auto 20px;background:radial-gradient(circle at 30% 30%,#ff6b81,#ff4757,#b31224);color:#fff;font-size:17px;font-weight:800;box-shadow:0 0 35px var(--glow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.wave-btn.playing{animation:pulse 2s infinite ease-in-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05);box-shadow:0 0 55px rgba(255,71,87,0.8)}}
.box{background:var(--card);border-radius:20px;padding:14px;margin-bottom:14px;border:1px solid #232332}
.lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:7px;font-weight:700}
.seg{display:flex;background:#101018;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;background:none;border:none;color:var(--sub);padding:7px;font-size:12px;font-weight:600;border-radius:9px;cursor:pointer}
.seg button.act{background:var(--accent);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{background:#101018;border:1px solid #2a2a3c;color:var(--text);padding:6px 13px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.act{background:#fff;color:#000;font-weight:700}
.player{background:var(--card);border-radius:22px;padding:16px;border:1px solid #252536;margin-top:auto}
.t-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cover{width:54px;height:54px;border-radius:12px;background:#262638;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.meta{flex:1;overflow:hidden}
.title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;color:#2ed573;margin-top:3px;font-weight:600}
input[type="range"]{width:100%;accent-color:var(--accent);height:4px}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin:4px 0 12px}
.ctrls{display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.c-btn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:8px}
.c-btn.main{width:50px;height:50px;border-radius:50%;background:#fff;color:#000;font-size:20px;display:flex;align-items:center;justify-content:center}
.fx{display:flex;gap:8px;margin-top:12px;border-top:1px solid #242434;padding-top:10px}
.fx button{flex:1;background:#101018;border:1px solid #2a2a3c;color:var(--sub);padding:7px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer}
.fx button.act{border-color:var(--accent);color:#fff;background:rgba(255,71,87,0.15)}
.inp{width:100%;background:var(--card);border:1px solid #2c2c3e;color:#fff;padding:12px;border-radius:14px;font-size:14px;margin-bottom:10px;outline:none}
.act-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:13px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:14px}
.item{background:var(--card);padding:11px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#12121a;border-top:1px solid #222230;display:flex;height:64px;z-index:100}
nav button{flex:1;background:none;border:none;color:var(--sub);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
nav button.act{color:var(--accent)}
</style>
</head>
<body>
<header>
  <div class="logo">Моя <span>Волна</span></div>
  <div class="badge" id="cacheBadge">Избранное: 0</div>
</header>

<div class="screen active" id="s-wave">
  <button class="wave-btn" id="waveBtn" onclick="startWave()"><span style="font-size:26px">▶</span><span>Моя волна</span></button>
  <div class="box">
    <div class="lbl">Степень новизны</div>
    <div class="seg">
      <button onclick="setOpt('nov','fam',this)">Знакомое</button>
      <button class="act" onclick="setOpt('nov','bal',this)">Баланс</button>
      <button onclick="setOpt('nov','new',this)">Открытия</button>
    </div>
    <div class="lbl">Язык треков</div>
    <div class="seg">
      <button class="act" onclick="setOpt('lang','all',this)">Все языки</button>
      <button onclick="setOpt('lang','ru',this)">Только русский</button>
    </div>
    <div class="lbl">Эпоха / Жанр</div>
    <div class="chips" id="genres">
      <div class="chip act" onclick="setGen('my',this)">Мой вкус</div>
      <div class="chip" onclick="setGen('80s hits',this)">Хиты 80-х</div>
      <div class="chip" onclick="setGen('90s hits',this)">Хиты 90-х</div>
      <div class="chip" onclick="setGen('2000s hits',this)">2000-е</div>
      <div class="chip" onclick="setGen('русский рок',this)">Русский рок</div>
      <div class="chip" onclick="addGen()">+ Свой</div>
    </div>
  </div>
  <div class="player">
    <div class="t-row">
      <div class="cover" id="cov">🎵</div>
      <div class="meta">
        <div class="title" id="tit">Нажми «Моя волна»</div>
        <div class="artist" id="art">Хиты 1980–2010 и твой вкус</div>
        <div class="status" id="stat">Готов к запуску</div>
      </div>
    </div>
    <input type="range" id="seek" value="0" min="0" max="100" oninput="seekTo(this.value)">
    <div class="times"><span id="cTime">0:00</span><span id="dTime">0:00</span></div>
    <div class="ctrls">
      <button class="c-btn" onclick="dislike()">👎</button>
      <button class="c-btn main" id="ppBtn" onclick="togglePlay()">▶</button>
      <button class="c-btn" onclick="nextTrack()">⏭</button>
      <button class="c-btn" id="likeBtn" onclick="like()">🤍</button>
    </div>
    <div class="fx">
      <button class="act" onclick="setSpd(1,true,this)">Обычный</button>
      <button onclick="setSpd(0.85,false,this)">Slowed</button>
      <button onclick="setSpd(1.2,false,this)">Speed Up</button>
    </div>
  </div>
</div>

<div class="screen" id="s-search">
  <div class="lbl">Поиск полных треков (1980–2026)</div>
  <div style="display:flex;gap:8px">
    <input class="inp" id="qInp" placeholder="Исполнитель - Песня...">
    <button class="act-btn" style="width:auto;padding:0 18px" onclick="doSearch()">Найти</button>
  </div>
  <div id="resList" style="margin-bottom:16px"></div>
  <div class="lbl">Перенос плейлиста (ВК / YT Music)</div>
  <textarea class="inp" id="impInp" style="min-height:95px" placeholder="Вставь список треков (каждый с новой строки):&#10;Кино - Группа крови&#10;Modern Talking - Cheri Cheri Lady"></textarea>
  <button class="act-btn" onclick="doImport()">Загрузить в волну</button>
</div>

<div class="screen" id="s-fav">
  <div class="lbl">Избранное</div>
  <div id="favList"></div>
</div>

<nav>
  <button class="act" onclick="tab('wave',this)">🌊<span>Моя волна</span></button>
  <button onclick="tab('search',this)">📥<span>Поиск и Импорт</span></button>
  <button onclick="tab('fav',this)">❤️<span>Избранное</span></button>
</nav>

<audio id="auA" preload="auto"></audio>
<audio id="auB" preload="auto"></audio>

<script>
const st = {
  nov: "bal", lang: "all", gen: "my", playing: false, ch: "A", cur: null, nxt: null, ready: false, spd: 1, pitch: true,
  likes: JSON.parse(localStorage.getItem("mw_likes") || "[]"),
  dislikes: JSON.parse(localStorage.getItem("mw_dis") || "[]"),
  seeds: JSON.parse(localStorage.getItem("mw_seeds") || '["Кино Группа крови","Modern Talking Cheri Cheri Lady","Руки Вверх 18 мне уже","Depeche Mode Enjoy the Silence","Сектор Газа Лирика","Queen Bohemian Rhapsody"]')
};

const auA = document.getElementById("auA"), auB = document.getElementById("auB");
const actAu = () => st.ch === "A" ? auA : auB;
const stbAu = () => st.ch === "A" ? auB : auA;
const log = t => document.getElementById("stat").innerText = t;

function isRu(t, a) {
  const s = (t + " " + a).toLowerCase();
  return /[а-яё]/.test(s) || ["kino", "кино", "ruki vverh", "сектор газа", "korol i shut", "nautilus", "ddt", "agata kristi", "bi-2", "zemfira", "tatu", "laskoviy may"].some(k => s.includes(k));
}

async function searchArchive(q) {
  try {
    const url = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}+AND+mediatype:audio&fl[]=identifier,title,creator&rows=15&output=json`;
    const r = await fetch(url);
    const j = await r.json();
    const docs = j.response?.docs || [];
    const res = [];
    for (let d of docs.slice(0, 8)) {
      const mRes = await fetch(`https://archive.org/metadata/${d.identifier}/files`);
      const mJson = await mRes.json();
      const mp3 = (mJson.result || []).find(f => f.name && f.name.toLowerCase().endsWith(".mp3") && !f.name.includes("_64kb"));
      if (mp3) {
        res.push({
          title: Array.isArray(d.title) ? d.title[0] : (d.title || q),
          artist: Array.isArray(d.creator) ? d.creator[0] : (d.creator || "Архив 1980-2010"),
          cover: `https://archive.org/services/img/${d.identifier}`,
          url: `https://archive.org/download/${d.identifier}/${encodeURIComponent(mp3.name)}`
        });
      }
      if (res.length >= 5) break;
    }
    return res;
  } catch (e) {
    return [];
  }
}

async function pickTrack() {
  let q = st.gen !== "my" ? (st.lang === "ru" ? st.gen + " русские" : st.gen) : "";
  if (!q) {
    const pool = (st.nov === "fam" && st.likes.length) ? st.likes.map(x => x.artist + " " + x.title) : st.seeds;
    const base = pool[Math.floor(Math.random() * pool.length)];
    q = st.nov === "new" ? base.split(" ")[0] : base;
  }
  let list = await searchArchive(q);
  list = list.filter(x => !st.dislikes.includes(x.artist + " - " + x.title) && (st.lang !== "ru" || isRu(x.title, x.artist)));
  return list[Math.floor(Math.random() * list.length)] || null;
}

async function startWave() {
  if (st.cur) return togglePlay();
  log("Ищу полный трек в архиве...");
  const t = await pickTrack();
  if (!t) return log("Не нашлось по фильтру, нажми еще раз");
  playNow(t);
  preloadNext();
}

function playNow(t) {
  st.cur = t; st.ready = false; st.playing = true;
  const p = actAu(); p.src = t.url; p.playbackRate = st.spd; p.preservesPitch = st.pitch; p.play();
  ui();
  log("Играет полный трек");
  updateMediaSession(t);
}

async function preloadNext() {
  log("Буферизация следующего трека...");
  const t = await pickTrack();
  if (t) {
    st.nxt = t;
    const s = stbAu(); s.src = t.url; s.load();
    st.ready = true;
    log("Готов: " + t.title);
  }
}

async function nextTrack() {
  if (st.ready && st.nxt) {
    actAu().pause();
    st.ch = st.ch === "A" ? "B" : "A";
    st.cur = st.nxt; st.nxt = null; st.ready = false; st.playing = true;
    const p = actAu(); p.playbackRate = st.spd; p.preservesPitch = st.pitch; p.play();
    ui();
    updateMediaSession(st.cur);
    preloadNext();
  } else {
    log("Ищу следующий трек...");
    const t = await pickTrack();
    if (t) { playNow(t); preloadNext(); }
  }
}

function togglePlay() {
  const p = actAu();
  if (!p.src) return startWave();
  if (p.paused) { p.play(); st.playing = true; } else { p.pause(); st.playing = false; }
  ui();
}

[auA, auB].forEach(el => {
  el.ontimeupdate = () => {
    if (el !== actAu()) return;
    const c = el.currentTime || 0, d = el.duration || 1;
    document.getElementById("seek").value = (c / d) * 100;
    document.getElementById("cTime").innerText = fmt(c);
    document.getElementById("dTime").innerText = fmt(d);
    if (d - c < 25 && !st.ready && d > 15) preloadNext();
  };
  el.onended = () => { if (el === actAu()) nextTrack(); };
});

const seekTo = v => { const p = actAu(); if (p.duration) p.currentTime = (v / 100) * p.duration; };
const setSpd = (r, pt, b) => { st.spd = r; st.pitch = pt; const p = actAu(); p.playbackRate = r; p.preservesPitch = pt; document.querySelectorAll(".fx button").forEach(x => x.className = ""); b.className = "act"; };
const setOpt = (k, v, b) => { st[k] = v; b.parentElement.querySelectorAll("button").forEach(x => x.className = ""); b.className = "act"; st.ready = false; if (st.playing) preloadNext(); };
const setGen = (v, b) => { st.gen = v; document.querySelectorAll(".chip").forEach(x => x.className = "chip"); b.className = "chip act"; st.ready = false; if (st.playing) preloadNext(); };

function addGen() {
  const g = prompt("Жанр, год или артист:");
  if (g) {
    st.gen = g;
    document.querySelectorAll(".chip").forEach(x => x.className = "chip");
    const d = document.createElement("div"); d.className = "chip act"; d.innerText = g;
    d.onclick = () => setGen(g, d);
    document.getElementById("genres").prepend(d);
    st.ready = false;
  }
}

function like() {
  if (!st.cur) return;
  if (!st.likes.some(x => x.title === st.cur.title)) {
    st.likes.unshift(st.cur);
    st.seeds.unshift(st.cur.artist + " " + st.cur.title);
    localStorage.setItem("mw_likes", JSON.stringify(st.likes));
    localStorage.setItem("mw_seeds", JSON.stringify(st.seeds.slice(0, 60)));
  }
  ui(); renderFav();
}

function dislike() {
  if (st.cur) {
    st.dislikes.push(st.cur.artist + " - " + st.cur.title);
    localStorage.setItem("mw_dis", JSON.stringify(st.dislikes));
    st.ready = false; nextTrack();
  }
}

async function doSearch() {
  const q = document.getElementById("qInp").value.trim();
  if (!q) return;
  const box = document.getElementById("resList");
  box.innerHTML = '<div style="color:var(--sub);font-size:13px">Ищу полные треки в архиве...</div>';
  const list = await searchArchive(q);
  box.innerHTML = list.length ? "" : '<div style="color:var(--sub);font-size:13px">Ничего не найдено</div>';
  list.forEach(t => {
    const d = document.createElement("div"); d.className = "item";
    d.innerHTML = `<div><b>${t.title}</b><br><span style="font-size:12px;color:var(--sub)">${t.artist}</span></div><button class="c-btn" style="font-size:16px">▶</button>`;
    d.onclick = () => { playNow(t); preloadNext(); tab("wave", document.querySelector("nav button")); };
    box.appendChild(d);
  });
}

function doImport() {
  const lines = document.getElementById("impInp").value.split("\n").map(x => x.trim()).filter(x => x.length > 2);
  if (!lines.length) return alert("Вставь список треков!");
  st.seeds = [...lines, ...st.seeds].slice(0, 100);
  localStorage.setItem("mw_seeds", JSON.stringify(st.seeds));
  document.getElementById("impInp").value = "";
  alert("Загружено треков: " + lines.length);
  tab("wave", document.querySelector("nav button"));
}

function renderFav() {
  const box = document.getElementById("favList");
  box.innerHTML = st.likes.length ? "" : '<div style="color:var(--sub);font-size:13px">Пока пусто</div>';
  st.likes.forEach(t => {
    const d = document.createElement("div"); d.className = "item";
    d.innerHTML = `<div><b>${t.title}</b><br><span style="font-size:12px;color:var(--sub)">${t.artist}</span></div><button class="c-btn" style="font-size:16px">▶</button>`;
    d.onclick = () => { playNow(t); tab("wave", document.querySelector("nav button")); };
    box.appendChild(d);
  });
  document.getElementById("cacheBadge").innerText = "Избранное: " + st.likes.length;
}

function tab(id, b) {
  document.querySelectorAll(".screen").forEach(x => x.className = "screen");
  document.getElementById("s-" + id).className = "screen active";
  document.querySelectorAll("nav button").forEach(x => x.className = "");
  b.className = "act";
  if (id === "fav") renderFav();
}

function ui() {
  document.getElementById("waveBtn").className = "wave-btn" + (st.playing ? " playing" : "");
  document.getElementById("ppBtn").innerText = st.playing ? "⏸" : "▶";
  if (st.cur) {
    document.getElementById("tit").innerText = st.cur.title;
    document.getElementById("art").innerText = st.cur.artist;
    document.getElementById("cov").innerHTML = st.cur.cover ? `<img src="${st.cur.cover}" style="width:100%;height:100%;object-fit:cover">` : "🎵";
    document.getElementById("likeBtn").innerText = st.likes.some(x => x.title === st.cur.title) ? "❤️" : "🤍";
  }
}

function updateMediaSession(track) {
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: track.artist,
      artwork: track.cover ? [{ src: track.cover, sizes: "300x300", type: "image/jpeg" }] : []
    });
    navigator.mediaSession.setActionHandler("play", togglePlay);
    navigator.mediaSession.setActionHandler("pause", togglePlay);
    navigator.mediaSession.setActionHandler("nexttrack", nextTrack);
  }
}

const fmt = s => Math.floor(s / 60) + ":" + (Math.floor(s % 60) < 10 ? "0" : "") + Math.floor(s % 60);
renderFav();
</script>
</body>
</html>
